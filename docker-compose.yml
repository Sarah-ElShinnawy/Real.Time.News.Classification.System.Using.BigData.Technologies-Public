# docker-compose.yml — News Streaming Big Data Pipeline
# Place at: C:\Users\sarah\Desktop\461-project\docker-compose.yml

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  bigdata-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Shared volumes (host paths → container paths)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  kafka-data:
  zookeeper-data:

# ─────────────────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Zookeeper ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    networks: [bigdata-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - ./data/zookeeper:/var/lib/zookeeper/data
      - ./logs/zookeeper:/var/log/zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    networks: [bigdata-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS:             "PLAINTEXT://kafka:9092"
      KAFKA_LISTENERS:                        "PLAINTEXT://0.0.0.0:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              48
      KAFKA_LOG_SEGMENT_BYTES:                1073741824
    volumes:
      - ./data/kafka:/var/lib/kafka/data
      - ./logs/kafka:/var/log/kafka
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kafka topic init ───────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    networks: [bigdata-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics …'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic gdelt-raw --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic gdelt-status --partitions 1 --replication-factor 1
      echo 'Topics ready.'
      "
    restart: "no"

  # ── Spark Master ───────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.6-python3
    container_name: spark-master
    networks: [bigdata-net]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./services/consumer:/app
      - ./data:/data
      - ./logs/spark:/opt/spark/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Spark Worker ───────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.6-python3
    container_name: spark-worker
    networks: [bigdata-net]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - ./services/consumer:/app
      - ./data:/data
      - ./logs/spark:/opt/spark/logs

  # ── GDELT Producer ─────────────────────────────────────────────────────────
  producer:
    build:
      context: ./services/producer
      dockerfile: Dockerfile
    container_name: gdelt-producer
    networks: [bigdata-net]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW:         gdelt-raw
      KAFKA_TOPIC_STATUS:      gdelt-status
      GDELT_POLL_INTERVAL:     900          # 15 minutes = GDELT update cadence
      RAW_DATA_DIR:            /data/raw
      MODEL_FLAG_FILE:         /data/models/.trained
    volumes:
      - ./data:/data
      - ./logs:/logs
    restart: on-failure

  # ── Spark Streaming Consumer ───────────────────────────────────────────────
  consumer:
    build:
      context: ./services/consumer
      dockerfile: Dockerfile
    container_name: spark-consumer
    networks: [bigdata-net]
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW:         gdelt-raw
      OUTPUT_PATH:             /data/hdfs/processed
      CHECKPOINT_PATH:         /data/checkpoints/stream
      TRIGGER_INTERVAL:        "60 seconds"
    volumes:
      - ./data:/data
      - ./logs:/logs
    restart: on-failure

  # ── Jupyter Notebook ───────────────────────────────────────────────────────
  jupyter:
    build:
      context: ./services/jupyter
      dockerfile: Dockerfile
    container_name: jupyter
    networks: [bigdata-net]
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      SPARK_MASTER:        spark://spark-master:7077
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/data
      - ./services/consumer:/app   # access preprocessing.py from notebooks
    depends_on:
      - spark-master